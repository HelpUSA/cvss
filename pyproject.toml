[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helpus-cvss-ai"
version = "0.2.0"
description = "HelpUS CVSS AI - Contextual Environmental Scoring & Operational Governance Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cvss==3.6",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "fastapi>=0.100.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --import-mode=importlib"
