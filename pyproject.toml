[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helpus-cvss-ai"
version = "0.2.0"
description = "HelpUS CVSS AI - Contextual Environmental Scoring & Operational Governance Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cvss==3.6",
    "scipy==1.18.1",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "fastapi==0.136.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --import-mode=importlib"
