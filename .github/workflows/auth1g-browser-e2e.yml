name: Auth-1G Browser E2E

on:
  push:
    branches:
      - "auth1g-*"
  pull_request:
    branches:
      - real-world-cvss
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 55

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth1g
          POSTGRES_PASSWORD: auth1g-ci-password
          POSTGRES_DB: cvss_auth1g
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth1g -d cvss_auth1g"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://auth1g:auth1g-ci-password@127.0.0.1:5432/cvss_auth1g?schema=public"
      BETTER_AUTH_SECRET: "auth1g-browser-e2e-secret-0123456789abcdef"
      BETTER_AUTH_URL: "http://127.0.0.1:3000"
      AUTH_PUBLIC_BASE_URL: "http://127.0.0.1:3000"
      AUTH_TRUSTED_ORIGINS: "http://127.0.0.1:3000"
      AUTH1G_BASE_URL: "http://127.0.0.1:3000"
      AUTH1G_USER_A_EMAIL: "auth1g-user-a@example.com"
      AUTH1G_USER_B_EMAIL: "auth1g-user-b@example.com"
      AUTH1G_PASSWORD: "Auth1G-CI-Password-2026!"
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install web dependencies
        working-directory: web
        shell: bash
        run: npm ci

      - name: Install Chromium
        working-directory: web
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        working-directory: web
        shell: bash
        run: npx prisma generate

      - name: Wait for disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          for ATTEMPT in $(seq 1 30); do
            if pg_isready \
              --host 127.0.0.1 \
              --port 5432 \
              --username auth1g \
              --dbname cvss_auth1g
            then
              echo "Disposable PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL: ${ATTEMPT}/30"
            sleep 2
          done

          echo "Disposable PostgreSQL did not become ready."
          exit 1

      - name: Apply schema to disposable PostgreSQL
        working-directory: web
        shell: bash
        run: npx prisma db push --skip-generate

      - name: Auth-1F PostgreSQL regression
        working-directory: web
        shell: bash
        run: npm run test:auth1f:integration

      - name: Auth-1B regression
        working-directory: web
        shell: bash
        run: npm run validate:auth1b

      - name: Auth-1C regression
        working-directory: web
        shell: bash
        run: npm run validate:auth1c

      - name: Auth-1D regression
        working-directory: web
        shell: bash
        run: npm run validate:auth1d

      - name: Auth-1E regression
        working-directory: web
        shell: bash
        run: npm run validate:auth1e

      - name: Provision disposable Auth-1G tenants
        working-directory: web
        shell: bash
        run: npm run auth1g:seed

      - name: Build Next.js
        working-directory: web
        shell: bash
        run: npm run build

      - name: Auth-1G browser E2E
        working-directory: web
        shell: bash
        run: npm run test:auth1g:e2e

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip pytest

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Real pipeline regression
        shell: bash
        run: |
          set -euo pipefail

          python -X utf8 \
            scripts/validate_real_pipeline.py \
            --skip-refresh \
            --skip-build

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth1g-playwright-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Auth-1G summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Auth-1G Browser E2E"
            echo
            echo "- Login UI: /login"
            echo "- Browser: Chromium through Playwright"
            echo "- Users: two disposable identities"
            echo "- Tenants: two disposable organizations"
            echo "- Cookies: real HttpOnly session cookies"
            echo "- Cross-tenant access: hidden with 404"
            echo "- Session revocation: revoke other sessions"
            echo "- PostgreSQL: disposable service container"
            echo "- Auth-1F executed before Auth-1G seed: yes"
            echo "- Railway accessed: no"
            echo "- Persistent database changed: no"
            echo "- Local Docker used: no"
            echo "- Local PostgreSQL used: no"
          } >> "$GITHUB_STEP_SUMMARY"