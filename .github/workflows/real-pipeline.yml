name: real-pipeline

on:
  push:
    branches:
      - real-world-cvss
      - "auth1f-*"
      - scientific-validation
      - "antigravity/*"
      - "chatgpt/*"
  pull_request:
    branches:
      - real-world-cvss
      - scientific-validation

jobs:
  ai-exchange-contract-validation:
    name: AI Exchange Contract Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate AI Exchange Contracts
        run: python scripts/ai_exchange_validate.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web dependencies
        run: |
          npm ci --prefix web
          npx --prefix web prisma generate --schema web/prisma/schema.prisma
      - name: Python test suite
        run: python -m pytest -q
      - name: TypeScript check
        run: npm --prefix web run typecheck
      - name: Web build
        run: npm --prefix web run build
      - name: Fetch and verify FIRST Reference Corpus fixtures
        run: python scripts/fetch_first_fixtures.py
      - name: Execute G1 FIRST Reference Calculator Corpus
        run: python scripts/run_first_reference_corpus_round4.py
      - name: Validate committed real-world pipeline baseline
        run: python scripts/validate_real_pipeline.py
