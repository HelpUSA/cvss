name: Real Pipeline Gate

on:
  push:
    branches:
      - real-world-cvss
      - "auth1f-*"
  pull_request:
    branches:
      - real-world-cvss

permissions:
  contents: read

jobs:
  validate-real-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BETTER_AUTH_SECRET: real-pipeline-validation-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_PUBLIC_BASE_URL: http://localhost:3000
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Validate real pipeline
        run: python scripts/validate_real_pipeline.py